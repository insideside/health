<!doctype html>
<html lang="ru" data-default-theme="auto">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Тренер">
<meta name="theme-color" content="#141311">
<meta name="build" content="BUILD_HASH">
<link rel="manifest" href="/manifest.json">
<!-- Иконка домашнего экрана вшита строкой data: (подставляет сервер): iOS не применяет apple-touch-icon,
     скачанный с самоподписанного HTTPS. Ровно одно объявление — лишние только путают выбор. -->
<link rel="apple-touch-icon" href="APPLE_ICON_URI">
<!-- ?v= — Safari держит значки вкладок в своём кэше; новая версия в адресе заставляет взять свежий -->
<link rel="icon" type="image/svg+xml" href="/favicon.svg?v=2">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png?v=2">
<title>Тренер</title>
<script src="/theme.js"></script>
<link rel="stylesheet" href="/stenogramma.css">
<link rel="stylesheet" href="/app.css">
<link rel="stylesheet" href="/ui-a.css">
<link rel="stylesheet" href="/ui-b.css">
<link rel="stylesheet" href="/ui-c.css">
<link rel="stylesheet" href="/accents.css">
</head>
<body>
<!-- подложка под строку состояния iPhone: в PWA она полупрозрачная, и прокрученный текст уезжал под часы -->
<div class="statusbar-bg" aria-hidden="true"></div>
<div id="app"><div class="boot note">Загрузка…</div></div>
<div class="rest-bar" id="rest" hidden></div>
<div class="toast" id="toast"></div>
<div class="modal-backdrop" id="modal" hidden></div>
<script type="module" src="/app.js"></script>
<script>
// приложение не запустилось (нет файла в офлайн-кэше, сбой загрузки модуля) - не висим на «Загрузка…» молча
setTimeout(function () {
  if (!document.querySelector('#app .boot')) return;
  document.getElementById('app').innerHTML = '<div class="boot note" style="max-width:420px;margin:15vh auto 0;padding:0 20px;text-align:center">' +
    '<p>Приложение не загрузилось.</p><p>' + (navigator.onLine ? 'Попробуйте обновить страницу.' :
    'Нет связи с сервером, а в памяти телефона не хватает части приложения. Подключитесь к домашней сети и откройте его один раз - дальше оно будет работать и без сети.') +
    '</p><p><button class="btn" onclick="location.reload()">Обновить</button></p></div>';
}, 12000);
</script>
</body>
</html>
